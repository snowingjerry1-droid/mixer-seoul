<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0908">
<title>MIXER SEOUL · 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Playfair+Display:wght@700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 레이아웃: 세로 모바일 단일 컬럼, 하단 탭. 어두운 라운지 — 검은 벨벳 바탕, 황동 램프 빛, 초록 대리석 포인트. */
:root{
  --bg:#1C120C; --bg-2:#261911; --card:#33231A; --card-2:#3C2A1F; --line:#4F3B2E; --line-2:#67503F;
  --fg:#FBF8F4; --fg-2:#DAD3CB; --fg-3:#ABA199;
  --brass:#ED752F; --brass-2:#FFA264; --brass-soft:rgba(237,117,47,.16); --glow:rgba(237,117,47,.4); --peach:#FFC29C;
  --marble:#C9965F; --marble-2:#F3DEC2; --marble-soft:rgba(243,222,194,.14);
  --shadow:0 14px 40px rgba(0,0,0,.55); --shadow-sm:0 6px 18px rgba(0,0,0,.4);
  --radius:18px; --radius-sm:12px;
  --font-body:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,system-ui,sans-serif;
  --font-display:"Gowun Batang","Nanum Myeongjo",serif; --font-logo:"Playfair Display","Gowun Batang",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;overflow-x:hidden;
  background-image:radial-gradient(ellipse 70% 40% at 50% -5%, rgba(237,117,47,.14) 0, transparent 70%);background-attachment:fixed}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--fg)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.hidden{display:none!important}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--peach);font-weight:700}
.eyebrow.dim{color:var(--fg-2)}

/* 앱 뼈대 */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;background:rgba(43,25,12,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .lamp{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFC89A,#ED752F 60%,#9A4718);box-shadow:0 0 14px 4px var(--glow)}
.brand .nm{font-family:var(--font-logo);font-weight:900;font-size:22px;line-height:1;color:var(--brass);letter-spacing:.04em}
.brand .en{font-size:9px;letter-spacing:.34em;color:var(--fg-2);margin-top:3px}
.logo{display:block;max-width:100%;height:auto;margin:0 auto;filter:drop-shadow(0 0 24px rgba(237,117,47,.35))}
.count-pill{font-size:12px;letter-spacing:.08em;color:var(--fg);border:1px solid var(--line-2);border-radius:999px;padding:5px 11px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:16px;color:var(--fg-2)}
main#view{flex:1;padding:8px 18px calc(92px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(51,32,15,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{position:relative;flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:12px;color:var(--fg-2);font-size:12px;letter-spacing:.06em;font-weight:600;transition:transform .15s,color .2s}
.tab .ic{font-size:20px;line-height:1;filter:grayscale(1) opacity(.8);transition:filter .2s}
.tab.active{color:var(--brass-2)}
.tab.active .ic{filter:none}
.tab.active::after{content:"";position:absolute;bottom:2px;width:18px;height:2px;border-radius:2px;background:var(--brass);box-shadow:0 0 8px var(--glow)}
.tab:active{transform:scale(.94)}
.tbl-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tbl-btn{padding:12px 0;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tbl-btn.on{border-color:var(--brass);color:var(--brass-2);background:var(--bg)}
.tbl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbl-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg)}
.tbl-cell .tn{font-family:var(--font-display);font-size:22px;line-height:1}
.tbl-cell .tc{font-size:12px;color:var(--fg-2)}
.tbl-cell.mine{border-style:dashed;border-color:var(--peach)}
.tbl-cell.on{border-color:var(--brass);border-style:solid;background:var(--bg);color:var(--brass-2)}
.g-b{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--fg-2);vertical-align:2px;font-family:var(--font-body)}

/* 공통 요소 */
.skel{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.sk{height:88px;border-radius:var(--radius);background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:shine 1.4s linear infinite}
.sk.big{height:150px}
.section{margin-top:26px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-title h2{font-size:21px;flex:1;min-width:0}
.section-title .sub{font-size:12px;letter-spacing:.08em;color:var(--fg-2);white-space:nowrap;flex:none}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:12px;animation:pop .35s ease both}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-family:var(--font-display);font-weight:700;font-size:19px}
.muted{color:var(--fg-2);font-size:14px}
.dim{color:var(--fg-3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--bg-2);color:var(--fg);border:1px solid var(--line-2);white-space:nowrap;transition:all .15s}
.chip.sel{background:var(--brass);color:#FFF4E8;border-color:var(--brass)}
.chip.dimchip{color:var(--fg-3);border-style:dashed}
.chip.hit{background:linear-gradient(110deg,var(--brass) 0%,#FFB07A 40%,var(--brass) 60%);background-size:200% 100%;color:#2B190C;border-color:transparent;animation:shine 2.4s linear infinite;box-shadow:0 0 14px var(--glow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;letter-spacing:.02em;
  background:var(--brass);color:#FFF4E8;box-shadow:0 8px 24px rgba(237,117,47,.28);transition:transform .12s,box-shadow .12s;text-align:center}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 8px rgba(237,117,47,.2)}
.btn.marble{background:linear-gradient(135deg,#E3C49A,#B88A5A);color:#2B190C;box-shadow:0 8px 24px rgba(184,138,90,.3)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2);box-shadow:none}
.btn.sm{min-height:38px;padding:6px 14px;font-size:13px;border-radius:11px;white-space:nowrap;flex:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--bg-2);outline:none;transition:border-color .15s,box-shadow .15s}
.field::placeholder{color:var(--fg-3)}
.field:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.counter{font-size:13px;color:var(--fg-2);text-align:right;margin-top:4px}
.empty{padding:28px 16px;text-align:center;color:var(--fg-2);border:1px dashed var(--line-2);border-radius:var(--radius);font-size:15px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--marble-soft);border:1px solid rgba(240,212,172,.3);border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;color:#F6E6CC;margin-bottom:12px}
.pill-note{font-size:11px;letter-spacing:.08em;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:3px 9px}
.hint-line{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line-2);font-size:15px}
.hint-line .k{font-size:12px;letter-spacing:.04em;color:var(--peach);white-space:nowrap;font-weight:700;min-width:56px}
.hint-line .v{color:var(--fg)}

@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-7px) rotate(var(--r,0deg))}}
@keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.92)}to{opacity:1;transform:none}}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes slideDown{from{transform:translateY(-120%)}to{transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 18px 2px var(--glow)}50%{box-shadow:0 0 34px 8px var(--glow)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spark{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* 입장 등록 */
#register{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(ellipse 80% 45% at 50% 0%, rgba(232,176,75,.16) 0, transparent 70%)}
.reg-wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.reg-head{text-align:center;padding-top:6px}
.reg-head .logo{width:190px;margin-bottom:4px}
.prog{width:100%;max-width:480px;margin:0 auto}
.prog-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .35s}
.prog-txt{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);margin-top:6px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2);transition:all .25s}
.dots i.on{background:var(--brass);box-shadow:0 0 10px var(--glow);transform:scale(1.3)}
.dots i.done{background:var(--marble-2)}
.reg-card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;animation:pop .35s ease both}
.reg-card h2{font-size:25px;margin-bottom:6px}
.reg-card .lead{color:var(--fg-2);font-size:15px;margin-bottom:18px}
.reg-card .ex{font-size:14px;color:var(--fg-2);margin-top:10px}
.reg-card .ex b{color:var(--peach);font-weight:700}
.quick-row{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.quick-row:last-child{border-bottom:0}
.quick-q{font-weight:700;font-size:15px}
.quick-a{display:flex;gap:8px}
.quick-btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);font-weight:700;font-size:16px;transition:all .15s}
.quick-btn.on{background:var(--brass);border-color:var(--brass);color:#FFF4E8;box-shadow:0 0 14px var(--glow)}
.reg-actions{display:flex;gap:10px;margin-top:12px}
.edit-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.edit-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;background:var(--bg-2);border:0;border-bottom:1px solid var(--line);color:var(--fg)}
.edit-row:last-child{border-bottom:0}
.edit-row:active{background:var(--card)}
.edit-row .el{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.edit-row .ek{font-size:12px;color:var(--peach);font-weight:700;letter-spacing:.02em}
.edit-row .ev{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-row .ea{font-size:22px;color:var(--fg-3)}
.reg-actions .btn{flex:1}
.field-err{min-height:18px;margin-top:10px;font-size:13px;color:#FFB4A3;text-align:center}
.big-kw{font-family:var(--font-display);font-size:40px;color:#FFF4E8;background:linear-gradient(135deg,#F79350,#ED752F);display:inline-block;padding:10px 28px;border-radius:999px;animation:bounceIn .6s cubic-bezier(.2,.9,.3,1.3) both;box-shadow:0 0 40px var(--glow)}
.next-do{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--marble-soft);border:1px solid rgba(243,222,194,.25);font-size:15px;line-height:1.5;text-align:left}
.next-do b{color:var(--peach)}
.nametag{background:var(--bg);border:1px solid var(--brass);border-radius:14px;padding:18px;text-align:center;margin:18px 0;position:relative}
.nametag::before{content:"";position:absolute;inset:5px;border:1px solid var(--line-2);border-radius:10px;pointer-events:none}
.nametag .nm{font-family:var(--font-display);font-size:30px}
.wait-pulse{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;color:var(--fg-2)}
.wait-pulse span{width:8px;height:8px;border-radius:50%;background:var(--brass);box-shadow:0 0 10px var(--glow);animation:glow 1.6s ease-in-out infinite}
#waiting{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));background-image:radial-gradient(ellipse 80% 45% at 50% 0%, rgba(237,117,47,.16) 0, transparent 70%)}
.nametag .kw{color:var(--peach);letter-spacing:.1em;font-size:14px;margin-top:4px;font-weight:700}

/* 홈 */
.spot{position:relative;overflow:hidden;background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:22px 20px 18px;box-shadow:var(--shadow);margin-bottom:10px}
.spot::before{content:"";position:absolute;left:50%;top:-80px;width:260px;height:260px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(237,117,47,.30) 0,rgba(237,117,47,.08) 45%,transparent 70%);pointer-events:none}
.spot .txt{font-family:var(--font-display);font-size:23px;line-height:1.4;margin:10px 0 12px;transition:opacity .4s;position:relative}
.spot .who{font-size:14px;color:var(--fg-2);position:relative}
.match-line{font-size:15px;margin:8px 0 10px;color:var(--fg)}
.match-line b{color:var(--peach);font-weight:800}
.ask-row{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;animation:pop .35s ease both}
.ask-row:active{transform:scale(.99)}
.ask-topic{font-family:var(--font-display);font-size:22px;line-height:1.3;color:var(--fg);word-break:keep-all}
.ask-who{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--fg-2)}
.ask-who b{color:var(--fg)}
.ask-badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(237,117,47,.18);color:var(--peach)}
.shout-tg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:14px 0 4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg)}
.shout-tg .sw{flex:none;width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s}
.shout-tg .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.shout-tg.on{border-color:var(--brass)}
.shout-tg.on .sw{background:var(--brass)}
.shout-tg.on .sw i{left:21px}
.shout-tg .tx{display:flex;flex-direction:column;gap:2px;font-size:15px}
.shout-tg .tx span{font-size:13px;color:var(--fg-2)}
.role-b{display:inline-block;vertical-align:middle;margin-left:4px;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.08em;border:1px solid var(--line-2);color:var(--fg-2);font-family:var(--font-body)}
.role-b.host{border-color:var(--brass);color:var(--brass)}
.lookprev{margin-top:4px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line-2);font-size:16px;color:var(--fg)}
.p-line{font-size:15px;color:var(--fg-2);margin-top:4px;word-break:keep-all}
.p-line b{color:var(--fg);font-weight:600}
.me-card{display:flex;gap:12px;align-items:center}

/* 키워드 벽 */
.cloud{position:relative;background:var(--bg-2);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:24px 12px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 8px;min-height:240px;overflow:hidden}
.cloud::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(237,117,47,.12),transparent 70%);pointer-events:none}
.cloud .kw{position:relative;animation:floaty var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);border-radius:999px;padding:.35em .85em;font-weight:700;line-height:1.1;cursor:pointer;transition:transform .15s;border:1px solid transparent}
.cloud .kw:active{transform:scale(.92)}
.cloud .kw small{font-size:.6em;opacity:.6;margin-left:3px}
.cloud .kw.mine{box-shadow:0 0 0 1px var(--brass),0 0 16px var(--glow)}
.c0{background:#5A3217;color:#FFC79F;border-color:#80491F!important}
.c1{background:#4C3820;color:#F9EBD6;border-color:#6E5436!important}
.c2{background:#56301F;color:#FFD3C4;border-color:#7A4433!important}
.c3{background:#4A3535;color:#F5E2E7;border-color:#6A5258!important}
.c4{background:#4A3C31;color:#FBF3EA;border-color:#6B5A4A!important}

/* 궁합 */
.pyr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;min-height:120px}
.pyr .prow{display:flex;gap:6px;animation:drop .35s ease both}
.pyr .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--fg);font-variant-numeric:tabular-nums}
.pyr .ch{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-display);font-size:17px;background:var(--marble-soft);color:#EAD7BC;border:1px solid rgba(227,196,154,.3)}
.pyr .prow:last-child .n{background:var(--brass);color:#FFF4E8;border-color:var(--brass);transform:scale(1.15);box-shadow:0 0 14px var(--glow)}
.pyr .dir{font-size:13px;letter-spacing:.08em;color:var(--fg-2);margin-top:4px}
.result-big{font-family:var(--font-display);font-size:76px;line-height:1;text-align:center;color:var(--brass-2);text-shadow:0 0 30px var(--glow);animation:bounceIn .7s cubic-bezier(.2,.9,.3,1.3) both}
.result-phrase{text-align:center;font-family:var(--font-display);font-size:21px;margin-top:8px}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--font-display);font-size:22px}
.vs .x{color:var(--brass);font-size:16px}
.rank-list .item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.rank-list .no{font-family:var(--font-display);font-size:20px;width:30px;text-align:center;color:var(--fg-2);font-variant-numeric:tabular-nums}
.rank-list .item:nth-child(1) .no{color:var(--brass-2);text-shadow:0 0 10px var(--glow)}
.rank-list .item:nth-child(2) .no{color:#EAD7BC}
.rank-list .item:nth-child(3) .no{color:#C9956A}
.rank-list .pct{font-family:var(--font-display);font-size:22px;color:var(--brass-2);margin-left:auto;font-variant-numeric:tabular-nums}
.rank-list .who{flex:1;min-width:0}
.rank-list .who .name{font-size:16px}
.rank-list .item.me{border-color:var(--brass);background:var(--brass-soft)}
.people-pick{display:flex;flex-wrap:wrap;gap:8px;max-height:240px;overflow-y:auto;padding:4px}
.people-pick .chip{min-height:40px;font-size:14px}

/* 이름 점수 */
.slot{display:flex;justify-content:center;gap:6px;margin:12px 0}
.slot .d{width:64px;height:88px;border-radius:14px;background:var(--bg);border:1px solid var(--line-2);color:var(--brass-2);font-family:var(--font-display);font-size:56px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -18px 28px rgba(0,0,0,.6)}
.slot .d.stop{animation:bounceIn .4s both;background:var(--brass);color:#FFF4E8;border-color:var(--brass);box-shadow:0 0 18px var(--glow)}
.reasons{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.reasons .r{display:flex;justify-content:space-between;gap:10px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;font-size:15px;animation:pop .4s ease both;text-align:left}
.reasons .r b{color:var(--marble-2);white-space:nowrap}
.title-tag{display:inline-block;margin-top:14px;font-family:var(--font-display);font-size:19px;color:var(--brass-2);border:1px solid var(--brass);padding:8px 18px;border-radius:999px;animation:bounceIn .6s .2s both;box-shadow:0 0 18px var(--glow)}

/* 아바타 / 모달 / 토스트 */
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:19px;color:#2B190C;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.modal{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg-2);border-top:1px solid var(--line-2);border-radius:24px 24px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1.1) both}
.modal h3{font-size:22px;margin-bottom:6px}
.grab{width:40px;height:4px;border-radius:3px;background:var(--line-2);margin:0 auto 16px}
.go-card{text-align:center;padding:10px 0 4px}
.go-card .avatar{margin:0 auto 10px;width:64px;height:64px;font-size:28px}
.go-card .nm{font-family:var(--font-display);font-size:30px}
.profile-lines{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:left}
.profile-lines .pl{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px}
.profile-lines .k{font-size:12px;letter-spacing:.04em;color:var(--peach);font-weight:700}
.profile-lines .v{font-family:var(--font-display);font-size:19px;margin-top:2px;line-height:1.35}
.go-card .hint{margin:12px 0 6px;padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--brass);position:relative}
.go-card .hint::before{content:"";position:absolute;inset:4px;border:1px solid var(--line-2);border-radius:10px;pointer-events:none}
.go-card .hint .k{font-size:12px;letter-spacing:.06em;color:var(--peach);font-weight:700}
.go-card .hint .v{font-family:var(--font-display);font-size:26px;margin-top:4px}
.openers{display:flex;flex-direction:column;gap:8px;margin-top:8px;text-align:left}
.openers .o{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line-2);font-size:16px;position:relative;padding-left:40px}
.openers .o::before{content:"“";position:absolute;left:14px;top:6px;font-family:var(--font-display);font-size:28px;color:var(--peach);line-height:1}
#toast{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:center;pointer-events:none;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.toast{pointer-events:auto;background:var(--card-2);border:1px solid var(--line-2);color:var(--fg);border-radius:16px;padding:12px 16px;max-width:520px;width:calc(100% - 32px);box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:slideDown .4s cubic-bezier(.2,.9,.3,1.2) both}
.toast .t{font-weight:700}
.toast .b{font-size:14px;color:var(--fg-2)}
.spark{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--brass-2);box-shadow:0 0 8px var(--glow);z-index:70;animation:spark 1.6s ease-out forwards;pointer-events:none}

/* 큰 화면 모드 */
body.screen{overflow:hidden}
#screenView{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;padding:20px 44px 24px}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:30px;border-bottom:1px solid var(--line-2);padding-bottom:14px}
.sc-top .logo{height:clamp(70px,13vh,120px);width:auto}
.sc-top .join{display:flex;align-items:center;gap:24px}
.sc-top .join .txt{text-align:right}
.sc-top .join .t1{font-family:var(--font-display);font-size:clamp(18px,3.2vh,30px)}
.sc-top .join .t2{font-size:clamp(13px,2vh,20px);color:var(--fg);letter-spacing:.04em}
.sc-top .join .cnt{font-family:var(--font-display);font-size:clamp(22px,4vh,38px);color:var(--peach)}
#qr{background:#fff;padding:10px;border-radius:12px;width:clamp(100px,16vh,150px);height:clamp(100px,16vh,150px)}
#qr img,#qr canvas{width:100%!important;height:100%!important}
.sc-body{display:grid;place-items:center;overflow:hidden}
.sc-top .join .txt,.sc-top .join .txt *{font-family:var(--font-body);font-weight:700;letter-spacing:-.01em}
.sc-rank,.sc-rank *{font-family:var(--font-body)!important}.sc-rank .no,.sc-rank .sc{font-weight:800}
.sc-panel{width:100%;max-width:1500px;animation:pop .6s ease both}
.sc-panel h2{font-family:var(--font-body);font-weight:800;letter-spacing:-.02em;word-break:keep-all;font-size:clamp(28px,5.2vh,50px);text-align:center;margin-bottom:clamp(10px,2vh,22px);color:var(--brass-2);text-shadow:0 0 30px var(--glow)}
.sc-cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:22px 18px}
.sc-cloud .kw{animation:floaty var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);border-radius:999px;padding:.3em .75em;font-weight:700;line-height:1.1;border:1px solid transparent}
.sc-rank{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.2vh,14px) 32px;font-size:clamp(16px,3vh,30px)}
.sc-rank .it{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(5px,1vh,12px) 22px;line-height:1.2}
.sc-rank .no{font-family:var(--font-display);font-size:clamp(20px,3.8vh,38px);color:var(--fg-2);width:52px}
.sc-rank .it:nth-child(1) .no{color:var(--brass-2)}.sc-rank .it:nth-child(2) .no{color:#EAD7BC}.sc-rank .it:nth-child(3) .no{color:#C9956A}
.sc-rank .sc{margin-left:auto;font-family:var(--font-display);font-size:clamp(20px,4vh,40px);color:var(--brass-2)}
.sc-rank .sub{font-size:clamp(12px,1.9vh,19px);color:var(--fg-2)}
.sc-gate{text-align:center}
.sc-gate h2{font-size:clamp(36px,7vh,72px)}
.sc-gate-sub{font-size:clamp(18px,3vh,30px);color:var(--fg-2);line-height:1.5;margin-top:10px}
.sc-gate-cnt{margin-top:clamp(16px,4vh,40px);font-size:clamp(22px,3.6vh,36px);color:var(--fg)}
.sc-gate-qr{margin:clamp(12px,2.6vh,28px) auto 0;width:clamp(200px,40vh,440px);height:clamp(200px,40vh,440px);background:#fff;padding:clamp(10px,1.6vh,18px);border-radius:16px;box-shadow:0 0 0 6px rgba(237,117,47,.25),0 20px 60px rgba(0,0,0,.6)}
.sc-gate-qr img,.sc-gate-qr canvas{width:100%!important;height:100%!important;display:block}
.sc-gate-row{display:flex;align-items:center;justify-content:center;gap:clamp(24px,4vw,70px);margin-top:clamp(8px,1.6vh,18px)}
.sc-gate-row .sc-gate-qr{margin:0;flex:none}
.sc-gate-map{flex:0 1 auto;width:min(46vw,calc(52vh * 1.4));display:flex;align-items:flex-end;gap:clamp(12px,1.6vw,28px)}
.sc-gate-map .fl{flex:1;min-width:0}.sc-gate-map .fl.f2{flex:0 0 22%}
.sc-gate-map .fk{font-size:clamp(14px,2.2vh,22px);font-weight:800;color:var(--fg-2);text-align:left;margin-bottom:-4px}
.sc-gate-map svg{width:100%!important;max-width:none!important;margin:0!important}
.sc-gate .sc-gate-cnt{margin-top:clamp(10px,2vh,22px)}
.sc-gate .sc-gate-cnt b{font-size:clamp(36px,7vh,72px)}
body.sc-gating .sc-top #qr{visibility:hidden}
.sc-gate-cnt b{font-family:var(--font-display);font-size:clamp(48px,11vh,110px);color:var(--brass-2);text-shadow:0 0 30px var(--glow);margin-right:8px}
.sc-spot{text-align:center;position:relative}
.sc-person{animation:personIn .55s cubic-bezier(.2,.9,.3,1.1) both;display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,80px)}
.sc-pleft{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:clamp(14px,3.2vh,34px);max-width:60%}
.sc-plines{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);padding-left:clamp(10px,1.4vw,22px);border-left:3px solid var(--brass)}
.sc-pline{display:flex;flex-direction:column;gap:2px}
.sc-pline .k{font-size:clamp(11px,1.6vh,15px);letter-spacing:.18em;color:var(--peach);font-weight:700}
.sc-pline .v{font-size:clamp(20px,3.3vh,34px);color:var(--fg);line-height:1.3}
.sc-pright{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.sc-pqr{background:#fff;padding:14px;border-radius:18px;width:clamp(180px,36vh,320px);height:clamp(180px,36vh,320px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sc-pqr img,.sc-pqr canvas{width:100%!important;height:100%!important}
.sc-pqr-cap{font-size:clamp(15px,2.4vh,24px);color:var(--fg);text-align:center;line-height:1.4;margin-top:6px}
.sc-pqr-cap b{color:var(--peach)}
@keyframes personIn{from{opacity:0;transform:translateX(60px) scale(.96)}to{opacity:1;transform:none}}
.sc-pav{width:clamp(70px,13vh,120px);height:clamp(70px,13vh,120px);border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(34px,6.5vh,60px);color:#2B190C;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 40px var(--pc,var(--glow))}
.sc-pname{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,8.5vh,80px);line-height:1.15;color:var(--fg)}
.sc-note{font-size:clamp(14px,2.2vh,22px);color:var(--fg-2);margin:-6px 0 14px;text-align:center}
.sc-pk{font-size:clamp(16px,2.6vh,26px);letter-spacing:.06em;color:var(--peach);font-weight:700;margin-bottom:-6px}
.sc-pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:clamp(12px,2vw,28px);width:100%;margin-top:clamp(6px,1.4vh,14px)}
.sc-pc{border-left:4px solid var(--brass);background:rgba(255,255,255,.03);padding:clamp(12px,2vh,22px) clamp(14px,1.6vw,26px)}
.sc-pc .k{font-size:clamp(14px,2.1vh,21px);color:var(--peach);font-weight:700;letter-spacing:.02em}
.sc-pc .v{font-family:var(--font-body);font-weight:700;font-size:clamp(24px,4.4vh,46px);line-height:1.3;letter-spacing:-.02em;color:var(--fg);margin-top:6px;word-break:keep-all}
.sc-pfoot{font-weight:600;word-break:keep-all;font-size:clamp(18px,3vh,30px);color:var(--fg-2);margin-top:clamp(2px,.6vh,6px)}
.sc-pfoot .dot{margin:0 .6em;color:var(--fg-3)}
.sc-pintro{font-family:var(--font-body);font-weight:800;font-size:clamp(40px,8.6vh,92px);line-height:1.25;letter-spacing:-.025em;color:var(--fg);text-wrap:balance;word-break:keep-all}
.sc-pmeta{font-size:clamp(16px,2.6vh,26px);color:var(--fg-2);line-height:1.6}
.sc-pmeta .sep{color:var(--fg-3)}
.sc-pkw{display:flex;gap:10px;flex-wrap:wrap;font-size:clamp(14px,2.2vh,22px)}
.sc-pkw span{border:1px solid var(--line-2);border-radius:999px;padding:4px 14px;color:var(--peach)}
.sc-pcount{display:none;position:fixed;right:44px;bottom:18px;font-size:clamp(12px,1.8vh,18px);color:var(--fg-3);letter-spacing:.1em}
.sc-music{position:fixed;left:44px;right:44px;bottom:16px;height:clamp(78px,13vh,132px);display:flex;align-items:center;gap:clamp(14px,2vw,28px);padding:10px 16px;background:rgba(51,35,26,.92);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.45);z-index:5}
.sc-music.pulse{animation:musicIn .6s cubic-bezier(.2,.9,.3,1.1)}
@keyframes musicIn{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
.sc-mvid{height:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;flex:none}
.sc-mvid iframe{width:100%!important;height:100%!important;display:block;pointer-events:none}
.sc-minfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sc-minfo .k{font-size:clamp(11px,1.6vh,15px);color:var(--peach);font-weight:700;letter-spacing:.06em}
.sc-minfo .t{font-family:var(--font-display);font-size:clamp(20px,3.6vh,36px);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-minfo .r{font-size:clamp(14px,2.4vh,24px);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-minfo .r b{color:var(--peach)}
.sc-mqr{height:100%;aspect-ratio:1;flex:none;background:#fff;border-radius:10px;padding:6px}
.sc-mqr:empty{display:none}
.sc-mqr img,.sc-mqr canvas{width:100%!important;height:100%!important}
.sc-mstart{position:fixed;right:44px;bottom:calc(clamp(78px,13vh,132px) + 30px);z-index:6;min-height:56px;font-size:18px}
body.has-music #screenView{padding-bottom:calc(clamp(78px,13vh,132px) + 36px)}
body.has-music .sc-pcount{bottom:calc(clamp(78px,13vh,132px) + 26px)}
body.has-music .sc-progress{bottom:auto;top:0}
.sc-spot .txt{font-family:var(--font-display);font-size:clamp(36px,8.5vh,80px);line-height:1.3;color:var(--fg)}
.sc-spot .who{font-size:clamp(18px,3.4vh,32px);color:var(--fg-2);margin-top:clamp(12px,2.8vh,26px)}
.sc-spot .kw{margin-top:18px;display:flex;justify-content:center;gap:12px;font-size:clamp(16px,2.6vh,24px);flex-wrap:wrap}
.sc-spot .kw span{border:1px solid var(--line-2);border-radius:999px;padding:6px 18px;color:var(--peach)}
.sc-progress{position:fixed;left:0;bottom:0;height:4px;background:var(--brass);box-shadow:0 0 10px var(--glow);width:0;transition:width 10s linear}

/* 관리자 */
.admin-row{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:14px}
.admin-row .x{margin-left:auto}
/* ── 블랙 테마 · 각진 모서리 · 빛번짐 제거 (2026-10-18) ── */
:root{
  --bg:#0A0908; --bg-2:#121110; --card:#171513; --card-2:#1D1A17; --line:#2A2622; --line-2:#3A342E;
  --fg:#F4F1EC; --fg-2:#C8BFB4; --fg-3:#9A9187;
  --brass:#ED752F; --brass-2:#F2853F; --brass-soft:rgba(237,117,47,.14); --glow:transparent;
  --peach:#C9A27A; --marble:#B08A63; --marble-2:#D9BC98; --marble-soft:rgba(201,162,122,.12);
  --radius:12px; --radius-sm:8px; --shadow:0 8px 24px rgba(0,0,0,.5); --shadow-sm:0 2px 8px rgba(0,0,0,.4);
}
body,#register,#waiting{background:var(--bg);background-image:none}
*{text-shadow:none!important}
.spot::before,.cloud::before{display:none}
.logo{filter:none}
.topbar{background:rgba(10,9,8,.92)}
.tabs{background:rgba(18,17,16,.97)}
.card,.reg-card,.spot,.cloud,.rank-list .item,.sc-rank .it,.admin-row,.reasons .r,.openers .o,.profile-lines .pl,.hint-line,.next-do,.empty,.banner,.nametag,.go-card .hint,.sc-music,.ms-card{border-radius:var(--radius)}
.card,.reg-card,.spot,.cloud{background:var(--card)}
.nametag::before{border-radius:8px}
.btn{border-radius:10px;box-shadow:none}
.btn.sm{border-radius:8px}
.field{border-radius:8px}
.chip,.cloud .kw,.sc-cloud .kw,.ms-who,.sc-spot .kw span,.sc-pkw span,.wait-pulse,.count-pill{border-radius:6px}
.modal{border-radius:16px 16px 0 0}
.toast{border-radius:10px}
.icon-btn,.avatar{border-radius:8px}
.slot .d,.quick-btn{border-radius:8px}
.pyr .n,.pyr .ch{border-radius:6px}
#qr,.sc-pqr,.sc-mqr,.sc-mvid{border-radius:8px}
.big-kw{border-radius:10px;box-shadow:none;background:var(--brass);color:#120A04}
.title-tag{border-radius:8px;box-shadow:none}
.chip.hit{background:rgba(237,117,47,.12);color:#F2853F;border-color:var(--brass);box-shadow:none;animation:none}
.chip.sel,.slot .d.stop,.pyr .prow:last-child .n,.quick-btn.on,.cloud .kw.mine,.dots i.on,.wait-pulse span,.sc-progress,.spark,.tab.active::after{box-shadow:none}
.cloud .kw.mine{outline:2px solid var(--brass);outline-offset:2px}
.brand .lamp,.reg-head .lamp{box-shadow:none;animation:none;background:var(--brass)}
.result-big{color:var(--brass)}
.rank-list .item:nth-child(1) .no,.sc-rank .it:nth-child(1) .no{color:var(--brass)}
.rank-list .item:nth-child(2) .no,.sc-rank .it:nth-child(2) .no{color:var(--fg)}
.rank-list .item:nth-child(3) .no,.sc-rank .it:nth-child(3) .no{color:var(--peach)}
.c0{background:#2A1A10;color:#F2A26B;border-color:#4A2A16!important}
.c1{background:#221C16;color:#E4CBAA;border-color:#3D3227!important}
.c2{background:#1B1B1B;color:#EDEDED;border-color:#333!important}
.c3{background:#2A1F17;color:#D8B48C;border-color:#46352A!important}
.c4{background:#161412;color:#C8BFB4;border-color:#2E2A26!important}
.banner{background:var(--card-2);border-color:var(--line-2);color:var(--fg-2)}
.ms-card{background:var(--card)}
/* 주황 바탕 위 글자는 진한 색 (흰 글자 대비 2.7 → 6.7) */
.btn:not(.ghost):not(.marble),.chip.sel,.quick-btn.on,.slot .d.stop,.pyr .prow:last-child .n,.big-kw{color:#120A04}
.btn.ghost{color:var(--fg)}
.search-box{position:relative;margin-bottom:8px}

const LOOK_MAX = 20;
function lookCompose(sel, extra) {
  const [c, h, pt] = sel, x = (extra || '').trim();
  const on = v => v && v !== '없음' ? v : '';
  const tries = [
    [on(c) ? `${c} 상의` : '', on(h), on(pt), x].filter(Boolean).join(' · '),
    [on(c), on(h), on(pt), x].filter(Boolean).join(' · '),
    [on(c), on(h), on(pt), x].filter(Boolean).join(', '),
  ];
  return tries.find(t => t.length <= LOOK_MAX) || tries[2];
}
// 줄마다 하나(없음 포함)는 꼭 고르고, 결과가 비면 직접 적게 함
function lookMissing(sel, extra) {
  const gi = sel.findIndex(x => !x); if (gi >= 0) return `${LOOK_GROUPS[gi][0]}에서 하나 골라 주세요. 맞는 게 없으면 ‘없음’이요.`;
  const v = lookCompose(sel, extra);
  if (!v) return '모두 ‘없음’이면 아래에 직접 적어 주세요. 예: 빨간 니트';
  if (v.length > LOOK_MAX) return `특징이 ${v.length}자예요. ${LOOK_MAX}자까지라 직접 적기를 줄이거나 하나를 ‘없음’으로 바꿔 주세요.`;
  return '';
}
function lookParse(look) {
  const parts = (look || '').split(/ · |, /).map(x => x.trim()); const sel = ['', '', '']; const rest = [];
  parts.forEach(x => { const c = x.replace(/ 상의$/, ''); const gi = LOOK_GROUPS.findIndex(([, opts]) => opts.includes(c)); if (gi >= 0 && !sel[gi]) sel[gi] = c; else if (x) rest.push(x); });
  return { sel, extra: rest.join(' · ') };
}

  return `<div class="stack">${LOOK_GROUPS.map(([g, opts], gi) => `<div><div class="eyebrow dim" style="margin:0 0 6px">${g}</div><div class="chips">${opts.map(o => `<span class="chip ${sel[gi] === o ? 'sel' : ''}" data-lg="${gi}" data-lo="${esc(o)}">${esc(o)}</span>`).join('')}</div></div>`).join('')}
    <div><div class="eyebrow dim" style="margin:4px 0 6px">직접 적기 (선택) · 목록에 없으면 ‘없음’ 누르고 여기에</div><input class="field" id="lookExtra" maxlength="15" placeholder="예: 빨간 니트, 체크 셔츠" value="${esc(extra || '')}" autocomplete="off"></div>
    <div class="lookprev" id="lookPrev">${esc(lookCompose(sel, extra)) || '<span class="dim">위에서 골라 주세요</span>'}</div></div>`;

}

const COMPOUND_JONG = { 'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ'] };
const BRIGHT_VOWELS = new Set(['ㅏ','ㅑ','ㅗ','ㅛ','ㅐ','ㅒ','ㅘ','ㅙ','ㅚ']);

function decompose(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return null;
  return { cho: CHO[Math.floor(code / 588)], jung: JUNG[Math.floor((code % 588) / 28)], jong: JONG[code % 28] };
}
function jamoStrokes(j) {
  if (!j) return 0;
  if (COMPOUND_JONG[j]) return COMPOUND_JONG[j].reduce((s, x) => s + (STROKES[x] || 1), 0);
  return STROKES[j] || 1;
}
// 글자 획수. 한글이 아닌 글자(영문 등)는 1로 계산
function charStrokes(ch) {
  const d = decompose(ch);
  if (!d) return 1;
  return jamoStrokes(d.cho) + jamoStrokes(d.jung) + jamoStrokes(d.jong);
}
function chars(name) { return Array.from((name || '').replace(/\s+/g, '')); }
// 두 이름을 한 글자씩 번갈아 나열 (남는 글자는 뒤에 이어 붙음)
function interleave(a, b) {
  const A = chars(a), B = chars(b), out = [];
  for (let i = 0; i < Math.max(A.length, B.length); i++) { if (A[i]) out.push(A[i]); if (B[i]) out.push(B[i]); }
  return out;
}
// 숫자 피라미드: 이웃한 두 수를 더해 일의 자리만 남기기를 두 자리가 남을 때까지 반복
function pyramidRows(letters) {
  let row = letters.map(charStrokes);
  const rows = [row];
  while (row.length > 2) {
    const next = [];
    for (let i = 0; i < row.length - 1; i++) next.push((row[i] + row[i + 1]) % 10);
    row = next; rows.push(row);
  }
  return rows;
}
function pyramidPercent(rows) {
  const last = rows[rows.length - 1];
  if (last.length >= 2) return last[0] * 10 + last[1];
  return (last[0] || 0) * 10;
}
// A→B, B→A 두 방향을 계산해 평균
const compatCache = new Map();
function compat(a, b) {
  const key = a + '\u0000' + b;
  if (compatCache.has(key)) return compatCache.get(key);
  const l1 = interleave(a, b), l2 = interleave(b, a);
  const r1 = pyramidRows(l1), r2 = pyramidRows(l2);
  const p1 = pyramidPercent(r1), p2 = pyramidPercent(r2);
  const res = { pct: Math.round((p1 + p2) / 2), dirs: [{ letters: l1, rows: r1, pct: p1 }, { letters: l2, rows: r2, pct: p2 }] };
  compatCache.set(key, res);
  return res;
}
function compatPhrase(pct) { return COMPAT_PHRASES.find(p => pct >= p.min).text; }

function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
// 이름 점수: 엉뚱한 근거 3줄 + 이름 고유의 운
function nameScore(name) {
  const cs = chars(name);
  const parts = cs.map(decompose).filter(Boolean);
  const jongN = parts.filter(p => p.jong).length;
  const brightN = parts.filter(p => BRIGHT_VOWELS.has(p.jung)).length;
  const chos = parts.map(p => p.cho);
  const repeated = chos.length !== new Set(chos).size;
  const total = cs.reduce((s, c) => s + charStrokes(c), 0);
  const reasons = [];
  if (!parts.length) reasons.push(['한글이 아닌 이름, 이국적인 울림', 10]);
  else if (jongN >= 2) reasons.push([`받침이 ${jongN}개, 든든한 이름`, 4 * Math.min(jongN, 3)]);
  else if (jongN === 1) reasons.push(['받침 하나, 균형 잡힌 이름', 7]);
  else reasons.push(['받침이 없어 발음이 매끈한 이름', 9]);
  if (brightN >= 2) reasons.push(['모음이 밝아 첫인상 산뜻', 8]);
  else if (brightN === 1) reasons.push(['밝은 모음과 깊은 모음의 조화', 7]);
  else reasons.push(['모음이 깊어 차분한 울림', 6]);
  if (repeated) reasons.push(['같은 자음 반복, 리듬감 있는 이름', 5]);
  else if (total % 7 === 0) reasons.push(['획수 합이 7의 배수, 행운의 이름', 11]);
  else if (total % 2 === 0) reasons.push([`총 획수 ${total}, 짝수의 안정감`, 4]);
  else reasons.push([`총 획수 ${total}, 홀수의 활력`, 5]);
  const luck = hashStr(name) % 31;
  const score = Math.max(0, Math.min(100, 40 + reasons.reduce((s, r) => s + r[1], 0) + luck));
  return { score, reasons, luck, title: SCORE_TITLES.find(t => score >= t.min).text };
}

  applySeatTables();
  if (state.me && data) { state.me = byId(state.me.id) || null; }
}
async function fetchState() {
  const { data, error } = await sb.from('mingle_state').select('open,playlist,cmd,cmd_at').eq('id', 1).maybeSingle();
  if (!error && data) { state.open = !!data.open; state.openKnown = true; state.playlist = data.playlist || ''; state.cmd = data.cmd || ''; state.cmdAt = data.cmd_at || null; }
}

// 게이트 상태에 맞춰 화면 전환 (등록된 사람만 해당)
function applyGate(fromRefresh) {
  if (!state.me) return;
  const waiting = !$('#waiting').classList.contains('hidden');
  const appShown = !$('#app').classList.contains('hidden');
  if (state.open && !appShown && $('#register').classList.contains('hidden')) {
    $('#waiting').classList.add('hidden'); $('#app').classList.remove('hidden'); render(); openPending();
    if (fromRefresh && waiting) { toast('문이 열렸어요!', '이제 사람들을 찾아보세요', { icon: '🎉', ms: 4000 }); sparks(50); }
  } else if (!state.open && appShown) {
    $('#app').classList.add('hidden'); closeModal(); showWaiting();
  }
}
let refreshTimer = null;
async function refresh(force) {
  await Promise.all([fetchProfiles(), fetchState()]);
  if (!state.me) { if (!$('#app').classList.contains('hidden') || !$('#waiting').classList.contains('hidden')) { $('#app').classList.add('hidden'); $('#waiting').classList.add('hidden'); showRegister(); } return; }
  applyGate(true);
  if (!state.open) { const c = $('#waitCount'); if (c) c.textContent = state.profiles.length; return; }
  updateCount();
  const sig = JSON.stringify(state.profiles);
  if (force || sig !== state.lastSig) { state.lastSig = sig; if (!state.busy) render(); }
}
function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => refresh(), 300); }
function startSync() {
  setInterval(() => refresh(), POLL_MS);
  fetchSeats(); setInterval(() => fetchSeats(), 20000);
  try {
    sb.channel('mixer-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mingle_profiles' }, scheduleRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mingle_state' }, scheduleRefresh)
      .subscribe();
  } catch (e) { }
}

function kwChips(p, highlight = [], compact = false) {
  const H = new Set(highlight.map(norm));
  const all = (p.keywords || []);
  if (!compact) return `<div class="chips">${all.map(k => `<span class="chip ${H.has(norm(k)) ? 'hit' : ''}">#${esc(k)}</span>`).join('')}</div>`;
  const hitI = all.filter(k => H.has(norm(k)) && !QUICK_ALL.has(k)), hitQ = all.filter(k => H.has(norm(k)) && QUICK_ALL.has(k)), rest = all.filter(k => !H.has(norm(k)) && !QUICK_ALL.has(k));
  const shown = (hitI.length + hitQ.length) ? [...hitI, ...hitQ.slice(0, 2)] : rest.slice(0, 3);
  const more = all.length - shown.length;
  return `<div class="chips">${shown.map(k => `<span class="chip ${H.has(norm(k)) ? 'hit' : ''}">#${esc(k)}</span>`).join('')}${more > 0 ? `<span class="chip dimchip">+${more}</span>` : ''}</div>`;
}

// 배치도 (내 테이블만 강조). 1~7번은 1층, 8번 이상은 2층 소파
// flip: 큰 화면용. 스크린 쪽을 정면에서 보는 방향(180° 돌림, 스크린이 위)
function seatMap(layout, floor, mine, sel, all, flip) {
  const hi = mine;

  if (flip) { const W = floor === 1 ? 1000 : 440, H = 700;
    its = its.map(i => ({ ...i, x: W - i.x - i.w, y: H - i.y - i.h, size: i.type === 'label' ? Math.round((i.size || 26) * 1.7) : i.size, text: i.type === 'label' ? String(i.text).replace(/[→←]/g, '').trim() : i.type === 'screen' ? (typeof flip === 'string' ? flip : '▲ 앞 · 대형 스크린') : i.text })); }

    minX = Math.min(minX, cx - hw); maxX = Math.max(maxX, cx + hw); minY = Math.min(minY, cy - hh - top); maxY = Math.max(maxY, cy + hh); });

  const pad = 20, col = floor === 1 ? '#F08A5D' : '#6FA3E0';

  its.forEach(i => {
    const cx = i.x + i.w / 2, cy = i.y + i.h / 2, rot = `rotate(${i.r || 0} ${cx} ${cy})`;

    else if (i.type === 'label') g += `<text x="${i.x + 4}" y="${i.y + i.h * .75}" font-size="${i.size || 26}" font-weight="800" fill="#B9AAA0">${esc(i.text)}</text>`;

      const stroke = picked ? '#E3B57A' : col, sw = on || picked ? 8 : 4;
      g += i.shape === 'round' ? `<ellipse cx="${cx}" cy="${cy}" rx="${i.w / 2}" ry="${i.h / 2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`
        : `<rect x="${i.x}" y="${i.y}" width="${i.w}" height="${i.h}" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" transform="${rot}"/>`;
      const big = Math.max(40, Math.min(flip ? 80 : 64, Math.min(i.w, i.h) * (i.shape === 'round' ? .5 : .85)));
      g += `<text x="${cx}" y="${cy + big * .36}" text-anchor="middle" font-size="${big}" font-weight="900" fill="${on ? '#1A120D' : '#FFF'}" opacity="${op}">${esc(i.text)}</text>`;
    }

}

function runSlot(el, score, done) {
  const digits = String(score).padStart(2, '0').split('');
  el.innerHTML = digits.map(() => '<div class="d">0</div>').join('');
  const ds = el.querySelectorAll('.d');
  let t = 0, stopped = 0; const tick = () => {
    ds.forEach((d, i) => { if (i >= stopped) d.textContent = Math.floor(Math.random() * 10); });
    t += 1;
    if (t === 14 && stopped === 0) { stopped = 1; ds[0].textContent = digits[0]; ds[0].classList.add('stop'); }
    if (!el.isConnected) return;
    if (t >= 26) { ds.forEach((d, i) => { d.textContent = digits[i]; d.classList.add('stop'); }); done && done(); return; }
    setTimeout(tick, 60 + t * 4);
  }; tick();
}

  if (p.curious && me.know && topicMatch(p.curious, me.know)) openers.push(`‘${p.curious}’ 궁금하시다면서요? 제가 좀 알아요`);

/* =========================================================
   6-1. 큰 화면 음악 (유튜브 재생목록을 큰 화면이 직접 재생)
   ========================================================= */
const music = { player: null, ready: false, src: '', lastCmdAt: undefined, curKey: '', tracks: {} };
// 관리판에 붙여 넣은 값 → { list: 재생목록ID } 또는 { ids: [영상ID…] }
function parseMusicSrc(v) {
  v = (v || '').trim(); if (!v) return null;
  const m = v.match(/[?&]list=([\w-]+)/) || (/^(PL|OL|RD|UU|FL)[\w-]{10,}$/.test(v) ? [0, v] : null);
  if (m) return { list: m[1] };
  const ids = [...v.matchAll(/(?:v=|youtu\.be\/|shorts\/|^|[\s,])([\w-]{11})(?=$|[\s,&?#])/g)].map(x => x[1]);
  return ids.length ? { ids: [...new Set(ids)] } : null;
}
function loadYT() {
  return new Promise(res => {
    if (window.YT && window.YT.Player) return res();
    const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { prev && prev(); res(); };
    if (!document.getElementById('ytApi')) { const sc = document.createElement('script'); sc.id = 'ytApi'; sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc); }
  });
}
function setupMusic(root) {
  root.insertAdjacentHTML('beforeend', `<div class="sc-music hidden" id="scMusic">
      <div class="sc-mvid"><div id="ytPlayer"></div></div>
      <div class="sc-minfo"><div class="k">🎵 지금 나오는 곡</div><div class="t" id="scMTitle">불러오는 중…</div><div class="r" id="scMReq"></div></div>
      <div class="sc-mqr" id="scMQr"></div></div>
    <button class="btn sc-mstart hidden" id="scMStart">🎵 음악 시작</button>`);
  $('#scMStart').onclick = () => { $('#scMStart').classList.add('hidden'); if (music.player && music.ready) music.player.playVideo(); };
  document.addEventListener('keydown', e => {
    if (!music.player || !music.ready) return;
    if (e.key === 'ArrowRight') music.player.nextVideo();
    else if (e.key === 'ArrowLeft') music.player.previousVideo();
    else if (e.key === ' ') { e.preventDefault(); runMusicCmd('toggle'); }
  });
  try { sb.channel('mixer-screen-music').on('postgres_changes', { event: '*', schema: 'public', table: 'mingle_state' }, async () => { await fetchState(); musicSync(); }).subscribe(); } catch (e) { }
  setInterval(() => updateNowPlaying(), 1500);
}
async function fetchTracks() {
  const { data } = await sb.from('mingle_tracks').select('video_id,profile_ids');
  if (data) { music.tracks = {}; data.forEach(t => { music.tracks[t.video_id] = t.profile_ids || []; }); }
}
function runMusicCmd(c) {
  const pl = music.player; if (!pl || !music.ready) return;
  if (c === 'next') pl.nextVideo(); else if (c === 'prev') pl.previousVideo();
  else if (c === 'toggle') { if (pl.getPlayerState() === 1) pl.pauseVideo(); else { $('#scMStart')?.classList.add('hidden'); pl.playVideo(); } }
}
async function musicSync() {
  const box = $('#scMusic'); if (!box) return;
  if (state.playlist !== music.src) { music.src = state.playlist; music.curKey = ''; await startPlayer(parseMusicSrc(state.playlist)); }
  if (music.lastCmdAt === undefined) music.lastCmdAt = state.cmdAt;              // 열기 전 명령은 무시
  else if (state.cmdAt && state.cmdAt !== music.lastCmdAt) { music.lastCmdAt = state.cmdAt; runMusicCmd(state.cmd); }
  updateNowPlaying();
}
async function startPlayer(src) {
  const box = $('#scMusic');
  if (!src) { box.classList.add('hidden'); document.body.classList.remove('has-music'); $('#scMStart').classList.add('hidden'); if (music.player && music.ready) music.player.stopVideo(); return; }
  box.classList.remove('hidden'); document.body.classList.add('has-music');
  await loadYT();
  const load = () => { if (src.list) music.player.loadPlaylist({ list: src.list, listType: 'playlist', index: 0 }); else music.player.loadPlaylist(src.ids, 0); music.player.setLoop(true); };
  if (music.player) { if (music.ready) load(); return; }
  music.player = new YT.Player('ytPlayer', {
    width: 320, height: 180,
    playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, disablekb: 1, iv_load_policy: 3 },
    events: {
      onReady: () => { music.ready = true; load(); setTimeout(() => { if (music.player.getPlayerState() !== 1) $('#scMStart').classList.remove('hidden'); }, 2500); },
      onStateChange: (e) => { if (e.data === 1) $('#scMStart').classList.add('hidden'); updateNowPlaying(); },
      onError: () => { setTimeout(() => { try { music.player.nextVideo(); } catch (e) { } }, 800); },
    },
  });
}
function currentVideoId() { try { const m = (music.player.getVideoUrl() || '').match(/[?&]v=([\w-]{11})/); return m ? m[1] : ''; } catch (e) { return ''; } }
function songNorm(x) { return (x || '').toLowerCase().replace(/\(.*?\)|\[.*?\]|official|music|video|audio|lyrics?|visualizer|performance|m\/v|\bmv\b|가사|뮤직비디오|공식/g, '').replace(/[^0-9a-z가-힣]/g, ''); }
// 지금 영상을 신청한 사람들: 연결표 우선, 없으면 곡명·가수로 맞춰 봄
function requestersFor(vid, title) {
  const ids = music.tracks[vid]; if (ids && ids.length) return ids.map(byId).filter(Boolean);
  const t = songNorm(title); if (!t) return [];
  return state.profiles.filter(p => {
    if (!p.song) return false;
    const [name, ...rest] = p.song.split(/\s+-\s+|\s*-\s*/); const n = songNorm(name), a = songNorm(rest.join(' '));
    return n.length >= 2 && t.includes(n) && (!a || t.includes(a) || n.length >= 5);
  });
}
function updateNowPlaying() {
  if (!music.player || !music.ready || !$('#scMusic')) return;
  const vid = currentVideoId(); let title = ''; try { title = music.player.getVideoData().title || ''; } catch (e) { }
  if (!vid || !title) return;
  const reqs = requestersFor(vid, title);
  const key = [vid, reqs.map(p => p.id).join(','), state.open].join('|');
  if (key === music.curKey) return; music.curKey = key;
  const song = reqs[0]?.song || title.replace(/\s*[\(\[][^\)\]]*(MV|M\/V|Official|Audio|Lyric|가사)[^\)\]]*[\)\]]/gi, '').trim();
  $('#scMTitle').textContent = song;
  const req = $('#scMReq'), qr = $('#scMQr'); qr.innerHTML = '';
  if (!state.open) { req.textContent = '신청곡이 흘러나오는 중'; }
  else if (!reqs.length) { req.textContent = '오늘 모두의 신청곡'; }
  else if (reqs.length === 1) {
    const p = reqs[0];
    req.innerHTML = `신청자는 지금 <b>${esc(p.hint || '어딘가')}</b>${MUSIC_SHOW_NAME ? ` · ${esc(p.display)}` : ''}`;
    try { new QRCode(qr, { text: `${location.origin}${location.pathname}?p=${p.id}`, width: 120, height: 120, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { }
  } else {
    req.innerHTML = `신청자 <b>${reqs.length}명</b> · ${reqs.slice(0, 3).map(p => esc(MUSIC_SHOW_NAME ? `${p.display}(${p.hint || '?'})` : (p.hint || '어딘가'))).join(', ')}${reqs.length > 3 ? ' 외' : ''}`;
  }
  const box = $('#scMusic'); box.classList.remove('pulse'); void box.offsetWidth; box.classList.add('pulse');
}

      resetStage++;
      if (resetStage === 1) { rb.textContent = '정말 초기화할까요? (한 번 더 누르면 확인)'; setTimeout(() => { if (resetStage === 1) { resetStage = 0; rb.textContent = '전체 초기화'; } }, 5000); return; }
      if (resetStage === 2) { rb.textContent = '마지막 확인: 전원 프로필이 삭제돼요. 눌러서 실행'; rb.style.background = '#7E2E22'; setTimeout(() => { if (resetStage === 2) { resetStage = 0; rb.textContent = '전체 초기화'; rb.style.background = '#B8513F'; } }, 5000); return; }
      rb.disabled = true; await call('reset'); resetStage = 0; toast('초기화했어요', '', { icon: '🧹' }); draw();
    };
  };
  draw();
}

/* =========================================================
   9. 시작
   ========================================================= */
async function boot() {
  if (params.get('screen')) return startScreenMode();
  if (params.get('admin') !== null) return startAdminMode(params.get('admin'));
  if (params.get('p')) { ls.set('mixer_pending', params.get('p')); history.replaceState(null, '', location.pathname); }
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
  $('#settingsBtn').onclick = openSettings;
  await Promise.all([fetchSeats(), fetchState()]); await fetchProfiles();   // 자리 명단을 먼저 받아야 등록·테이블 번호가 맞아요
  state.me = state.profiles.find(p => p.device_id === deviceId()) || null;
  if (!state.me) { showRegister(); }
  else if (!state.open) { showWaiting(); }
  else { $('#app').classList.remove('hidden'); await refresh(true); openPending(); }
  startSync();
}
boot();
</script>
